<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a3330">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UCC Cardiológicos HM">
  <title>Unidad Cuidados Críticos Cardiológicos HM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20261114e">
</head>
<body>
  <div class="layout">
    <header class="app-bar">
      <nav class="nav" id="sectionNav" aria-label="Secciones"></nav>
    </header>

    <main class="main tone-formacion">
      <header class="topbar">
        <div class="title-block">
          <div class="title-row">
            <div class="page-brand" id="pageBrand">
              <div class="brand-mark" aria-hidden="true">HM</div>
              <p class="page-brand-name">Unidad de Soporte cardíaco Montepríncipe</p>
            </div>
            <h1 id="pageTitle">Formación</h1>
            <div id="sectionTeam" class="section-team" hidden></div>
          </div>
          <p class="crumbs" id="crumbs">UCC Cardiológicos HM / Formación</p>
        </div>
        <div class="topbar-aside">
          <div class="user-menus" id="userMenu" hidden>
            <div class="user-menu" data-role="medicos">
              <button type="button" class="user-menu-btn user-menu-btn-img" id="userMenuBtnMedicos" aria-expanded="false" aria-controls="userMenuPanelMedicos" aria-label="Médicos" title="Médicos">
                <img src="../assets/inicio/icono-medicos.png" alt="" width="36" height="36" decoding="async">
                <span class="user-menu-caption">Médicos <span class="user-menu-count" id="userMenuCountMedicos">0</span></span>
              </button>
              <div class="user-menu-panel" id="userMenuPanelMedicos" hidden></div>
            </div>
            <div class="user-menu" data-role="enfermeria">
              <button type="button" class="user-menu-btn user-menu-btn-img" id="userMenuBtnEnfermeria" aria-expanded="false" aria-controls="userMenuPanelEnfermeria" aria-label="Enfermería" title="Enfermería">
                <img src="../assets/inicio/icono-enfermeria.png" alt="" width="36" height="36" decoding="async">
                <span class="user-menu-caption">Enfermería <span class="user-menu-count" id="userMenuCountEnfermeria">0</span></span>
              </button>
              <div class="user-menu-panel" id="userMenuPanelEnfermeria" hidden></div>
            </div>
          </div>
          <p class="meta" id="pageMeta">7 recursos</p>
        </div>
      </header>
      <div class="viewer" id="viewer"></div>
    </main>
  </div>
  <script src="app.js?v=20261114e"></script>
</body>
</html>
